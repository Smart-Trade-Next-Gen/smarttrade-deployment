  #     MARKET_DATA_SERVICE_URL: ${MARKET_DATA_SERVICE_URL:-http://market-data-service:8000}
  #
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     market-data-service:
  #       condition: service_healthy
  #     auth-service:
  #       condition: service_started
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   networks:
  #     - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Journal Service (Port 8007)
  # ──────────────────────────────────────────────────────────────────────
  journal-service:
    container_name: journal-service
    build:
      context: ..
      dockerfile: journal-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../journal-service:/app/journal-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && (uv run alembic upgrade heads || uv run alembic upgrade head || true) && uv run uvicorn journal_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8007:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      <<: *common-env
      SERVICE_NAME: journal-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_journal_service
      MARKET_DATA_SERVICE_URL: ${MARKET_DATA_SERVICE_URL:-http://market-data-service:8000}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
      auth-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

