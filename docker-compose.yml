  #     - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # AI Scoring Service (Port 8017)
  # ──────────────────────────────────────────────────────────────────────
  # Deterministic company research + scoring. Pulls fundamentals,
  # screener data, and prices from MDS/screener-mcp; publishes
  # scoring.research.* lifecycle events.
  ai-scoring-service:
    container_name: ai-scoring-service
    build:
      context: ..
      dockerfile: ai-scoring-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../ai-scoring-service:/app/ai-scoring-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && (uv run alembic upgrade heads || uv run alembic upgrade head || true) && uv run uvicorn ai_scoring_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8017:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      <<: *common-env
      SERVICE_NAME: ai-scoring-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_ai_scoring_service
      MARKET_DATA_SERVICE_URL: http://market-data-service:8000
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8000
      SCREENER_MCP_URL: ${SCREENER_MCP_URL:-http://screener-mcp:8000}
      SCREENER_MCP_TOKEN: ${MCP_AUTH_TOKEN:-}
      # Pipeline acting identity: pipeline/batch runs resolve broker
      # sessions under this account (the user with the live FYERS
      # connection). Reuses the research-agent credentials; empty →
      # the API caller's identity is used.
      ACTING_USERNAME: ${RESEARCH_AGENT_USERNAME:-}
      ACTING_PASSWORD: ${RESEARCH_AGENT_PASSWORD:-}
      # Parked-run re-announce sweep: republishes awaiting_analysis for
      # runs parked > MIN_AGE so lost triggers self-heal
      RESEARCH_REPUBLISH_INTERVAL_SECONDS: ${RESEARCH_REPUBLISH_INTERVAL_SECONDS:-300}
      RESEARCH_REPUBLISH_MIN_AGE_SECONDS: ${RESEARCH_REPUBLISH_MIN_AGE_SECONDS:-900}
      # Periodic watchlist/holdings research — market-hours gated;
      # caps bound the per-tick spend (each run spawns an agent session)
      RESEARCH_MONITOR_ENABLED: ${RESEARCH_MONITOR_ENABLED:-true}
      RESEARCH_MONITOR_INTERVAL_MINUTES: ${RESEARCH_MONITOR_INTERVAL_MINUTES:-60}
      RESEARCH_MONITOR_WATCHLIST_CAP: ${RESEARCH_MONITOR_WATCHLIST_CAP:-50}
      RESEARCH_MONITOR_HOLDINGS_CAP: ${RESEARCH_MONITOR_HOLDINGS_CAP:-25}
      RESEARCH_MONITOR_PRIORITY: ${RESEARCH_MONITOR_PRIORITY:-10}
      # Comma-separated YYYY-MM-DD NSE holidays (IST) — operator-declared
      RESEARCH_MONITOR_HOLIDAYS: ${RESEARCH_MONITOR_HOLIDAYS:-}
      RESEARCH_MONITOR_HOLDING_TYPE: ${RESEARCH_MONITOR_HOLDING_TYPE:-SETTLED}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      market-data-service:
        condition: service_started
      screener-mcp:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Research Agent (opt-in: docker compose --profile agents up)
  # ──────────────────────────────────────────────────────────────────────
  # Watches ai-scoring for runs parked at AWAITING_ANALYSIS and completes
  # each via a headless Devin CLI session running the service-owned
  # company_research prompt (self-contained — fetched from
  # /research/agent-prompts at dispatch, no skill-file dependency).
  # The LLM lives here — never inside the services. Needs
  # RESEARCH_AGENT_USERNAME/PASSWORD in .env (a dedicated account
  # recommended) and the host Devin CLI mounted via DEVIN_EXT_DIR.
  research-agent:
    container_name: research-agent
    build:
      context: ../research-agent
    profiles: ["agents"]
    restart: unless-stopped
    volumes:
      # Devin CLI binary + its bundled resources (skills/docs share dir)
      - ${DEVIN_EXT_DIR:-/usr/share/devin-desktop/resources/app/extensions/windsurf/devin}:/opt/devin:ro
      # Devin auth/session state — reuse the host login (:z = SELinux
      # shared label, required for writes like the rest of the stack)
      - ${HOME}/.config/devin:/root/.config/devin:z
      - ${HOME}/.local/share/devin:/root/.local/share/devin:z
      # Smart-Trade workspace — read access for agent sessions
      - ..:/workspace:z
    environment:
      AI_SCORING_URL: http://ai-scoring-service:8000
      AUTH_URL: http://auth-service:8000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RESEARCH_AGENT_USERNAME: ${RESEARCH_AGENT_USERNAME:-}
      RESEARCH_AGENT_PASSWORD: ${RESEARCH_AGENT_PASSWORD:-}
      RESEARCH_AGENT_TOKEN: ${RESEARCH_AGENT_TOKEN:-}
      RECLAIM_INTERVAL_SECONDS: ${RESEARCH_AGENT_RECLAIM_SECONDS:-300}
      STREAM_BLOCK_MS: ${RESEARCH_AGENT_BLOCK_MS:-30000}
      RUN_TIMEOUT_SECONDS: ${RESEARCH_AGENT_TIMEOUT_SECONDS:-3600}
      RUN_MAX_ATTEMPTS: ${RESEARCH_AGENT_MAX_ATTEMPTS:-2}
      RUN_RETRY_COOLDOWN_SECONDS: ${RESEARCH_AGENT_RETRY_COOLDOWN_SECONDS:-3600}
      RUN_MAX_PARALLEL: ${RESEARCH_AGENT_MAX_PARALLEL:-4}
      DEVIN_PERMISSION_MODE: ${DEVIN_PERMISSION_MODE:-dangerous}
      # Effort is encoded in the model name (swe-2-low/-high/-max)
      DEVIN_MODEL: ${DEVIN_MODEL:-swe-2-high}
      # Devin auth — either set WINDSURF_API_KEY in .env, or run
      # `devin auth login` once on the host (credentials.toml is
      # mounted through ~/.local/share/devin)
      WINDSURF_API_KEY: ${WINDSURF_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      ai-scoring-service:
        condition: service_healthy
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Portfolio Service (Port 8008)
  # ──────────────────────────────────────────────────────────────────────
  # Refactored to be a read-only consumer of position/holding snapshot events
  # Only depends on postgres (for persistence) and redis (for event bus)
  portfolio-service:
    container_name: portfolio-service
    build:
      context: ..
      dockerfile: portfolio-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../portfolio-service:/app/portfolio-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && uv run alembic upgrade head && uv run uvicorn portfolio_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8008:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s  # Increased for event bus initialization
    environment:
      <<: *common-env
      SERVICE_NAME: portfolio-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_portfolio_service

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Notification Service (Port 8011)
  # ──────────────────────────────────────────────────────────────────────
  notification-service:
    container_name: notification-service
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../notification-service:/app/notification-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && (uv run alembic upgrade heads || uv run alembic upgrade head || true) && uv run uvicorn notification_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8011:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_notification_service

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # UI Service (Port 3000)
  # ──────────────────────────────────────────────────────────────────────
  ui-service:
    container_name: ui-service
    build:
      context: ../smarttrade-frontend
      dockerfile: Dockerfile
      target: runtime-dev
    volumes:
      - ../smarttrade-frontend:/app:z
      - /app/node_modules
    ports:
      - "3000:5173"
    tty: true
    environment:
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:8000
      BROKER_ADAPTER_SERVICE_URL: http://broker-adapter-service:8000
      MARKET_DATA_SERVICE_URL: http://market-data-service:8000
      PAPER_BROKER_SERVICE_URL: http://paper-broker-service:8000
      JOURNAL_SERVICE_URL: http://journal-service:8000
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      AI_SCORING_SERVICE_URL: http://ai-scoring-service:8000
      VITE_AUTH_SERVICE_URL: http://auth-service:8000
      VITE_BROKER_ADAPTER_SERVICE_URL: http://broker-adapter-service:8000
      VITE_MARKET_DATA_SERVICE_URL: http://market-data-service:8000
      VITE_PAPER_BROKER_SERVICE_URL: http://paper-broker-service:8000
      VITE_JOURNAL_SERVICE_URL: http://journal-service:8000
      VITE_PORTFOLIO_SERVICE_URL: http://portfolio-service:8000
      VITE_NOTIFICATION_SERVICE_URL: http://notification-service:8000
      VITE_AI_SCORING_SERVICE_URL: http://ai-scoring-service:8000
      VITE_MDS_WS_URL: ws://market-data-service:8000
      VITE_NOTIFICATION_WS_URL: ws://notification-service:8000
    depends_on:
      auth-service:
        condition: service_started
      broker-adapter-service:
        condition: service_started
      market-data-service:
        condition: service_started
      paper-broker-service:
        condition: service_started
      journal-service:
        condition: service_started
      portfolio-service:
        condition: service_started
      notification-service:
        condition: service_started
      ai-scoring-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

networks:
  smarttrade:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis-insight-data:
    driver: local
  screener-exports:
    driver: local
