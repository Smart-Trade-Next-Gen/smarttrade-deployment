  #   ports:
  #     - "8006:8000"
  #   tty: true
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 30s
  #   environment:
  #     <<: *common-env
  #     SERVICE_NAME: strategy-service
