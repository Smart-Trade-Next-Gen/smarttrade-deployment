  # ──────────────────────────────────────────────────────────────────────
  # Portfolio Service (Port 8008)
  # ──────────────────────────────────────────────────────────────────────
  # Refactored to be a read-only consumer of position/holding snapshot events
  # Only depends on postgres (for persistence) and redis (for event bus)
  portfolio-service:
    container_name: portfolio-service
    build:
      context: ..
      dockerfile: portfolio-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../portfolio-service:/app/portfolio-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && uv run alembic upgrade head && uv run uvicorn portfolio_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8008:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s  # Increased for event bus initialization
    environment:
      <<: *common-env
      SERVICE_NAME: portfolio-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_portfolio_service

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Notification Service (Port 8011)
  # ──────────────────────────────────────────────────────────────────────
  notification-service:
    container_name: notification-service
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../notification-service:/app/notification-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && (uv run alembic upgrade heads || uv run alembic upgrade head || true) && uv run uvicorn notification_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8011:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_notification_service

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

networks:
  smarttrade:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis-insight-data:
    driver: local
