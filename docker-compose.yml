version: "3.9"

# ============================================================================
# SmartTrade Docker Compose Configuration
# ============================================================================
# Single source of truth for local development and testing
# - Postgres on port 5432 (standard)
# - All services configured with proper health checks
# - Environment variables sourced from .env
# ============================================================================

x-common-env: &common-env
  PYTHONPATH: /app/smarttrade-common/src
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-auto}
  ENV: ${ENV:-local}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  FYERS_APP_ID: ${FYERS_APP_ID}
  FYERS_MDS_ACCESS_TOKEN: ${FYERS_MDS_ACCESS_TOKEN:-mock_token_for_testing}
  UV_PROJECT_ENVIRONMENT: ${UV_PROJECT_ENVIRONMENT:-/opt/venv}
  UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
  UV_LINK_MODE: ${UV_LINK_MODE:-copy}
  PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}

services:

  # ──────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────────────────────────────
  postgres:
    container_name: postgres
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Redis Event Bus & Cache
  # ──────────────────────────────────────────────────────────────────────
  redis:
    container_name: redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # RedisInsight UI (Port 8010)
  # ──────────────────────────────────────────────────────────────────────
  redis-insight:
    container_name: redis-insight
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "8010:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Authentication Service (Port 8001)
  # ──────────────────────────────────────────────────────────────────────
  auth-service:
    container_name: authentication-service
    build:
      context: ..
      dockerfile: authentication-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../authentication-service:/app/authentication-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && (uv run alembic upgrade heads || uv run alembic upgrade head || true) && uv run uvicorn authentication_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8001:8000"
    tty: true
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_authentication_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Market Data Service (Port 8004)
  # ──────────────────────────────────────────────────────────────────────
  market-data-service:
    container_name: market-data-service
    build:
      context: ..
      dockerfile: market-data-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../market-data-service:/app/market-data-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && (uv run alembic upgrade heads || uv run alembic upgrade head || true) && uv run uvicorn market_data_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8004:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      <<: *common-env
      SERVICE_NAME: market-data-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_market_data_service
      BROKER_ADAPTER_SERVICE_URL: ${BROKER_ADAPTER_SERVICE_URL:-http://broker-adapter-service:8000}
      PAPER_BROKER_SERVICE_URL: http://paper-broker-service:8000
      PAPER_BROKER_SERVICE_WEBSOCKET_URL: ws://paper-broker-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Paper Broker Service (Port 8002)
  # ──────────────────────────────────────────────────────────────────────
  paper-broker-service:
    container_name: paper-broker-service
    build:
      context: ..
      dockerfile: paper-broker-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../paper-broker-service:/app/paper-broker-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && (uv run alembic upgrade heads || uv run alembic upgrade head || true) && uv run uvicorn paper_broker_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8002:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      <<: *common-env
      SERVICE_NAME: paper-broker-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_paper_broker_service
      MARKET_DATA_SERVICE_URL: ${MARKET_DATA_SERVICE_URL:-http://market-data-service:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Broker Adapter Service (Port 8005)
  # ──────────────────────────────────────────────────────────────────────
  broker-adapter-service:
    container_name: broker-adapter-service
    build:
      context: ..
      dockerfile: broker-adapter-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../broker-adapter-service:/app/broker-adapter-service:z
      - ../smarttrade-common:/app/smarttrade-common:z
    command: bash -c "uv sync --no-dev && (uv run alembic upgrade heads || uv run alembic upgrade head || true) && uv run uvicorn broker_adapter_service.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/smarttrade-common/src --reload-dir ./src"
    ports:
      - "8005:8000"
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      <<: *common-env
      SERVICE_NAME: broker-adapter-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smarttrade_broker_adapter_service
      PAPER_BROKER_SERVICE_URL: http://paper-broker-service:8000
      BROKER_REDIRECT_URI: ${BROKER_REDIRECT_URI:-http://www.smarttrade.asia/}
      FYERS_APP_SECRET: ${FYERS_APP_SECRET}
      RISK_VALIDATION_ENABLED: ${RISK_VALIDATION_ENABLED:-true}
      USE_OUTBOX_PATTERN: false
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      market-data-service:
        condition: service_healthy
      # user-setting-service:
      #   condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  # ──────────────────────────────────────────────────────────────────────
  # Strategy Service (Port 8006) — DISABLED
  # Strategy service is not currently supported. Re-enable when
  # strategy.decision schema is registered and the runner is ready.
