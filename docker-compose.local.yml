  auth-service:
    container_name: authentication-service
    build:
      context: ..
      dockerfile: authentication-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../authentication-service:/app/authentication-service
      - ../smarttrade-common:/app/smarttrade-common
    command: bash -c "pip uninstall -y smarttrade-common 2>/dev/null; uv sync && pip install -e /app/smarttrade-common 2>/dev/null && uv run uvicorn authentication_service.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smarttrade_authentication_service
      UV_INDEX_URL: "https://pypi.org/simple"   # fallback mirror
      UV_LINK_MODE: "copy"                      # suppress hardlink warnings
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

