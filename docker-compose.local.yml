  broker-adapter-service:
    container_name: broker-adapter-service
    build:
      context: ..
      dockerfile: broker-adapter-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../broker-adapter-service:/app/broker-adapter-service
      - ../smarttrade-common:/app/smarttrade-common
    command: bash -c "pip uninstall -y smarttrade-common 2>/dev/null; uv sync && pip install -e /app/smarttrade-common 2>/dev/null && uv run uvicorn broker_adapter_service.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smarttrade_broker_adapter_service
      UV_INDEX_URL: "https://pypi.org/simple"   # fallback mirror
      UV_LINK_MODE: "copy"                      # suppress hardlink warnings
      BROKER_REDIRECT_URI: http://www.smarttrade.asia/
      FYERS_APP_SECRET: FM7DZKQPZE
      RISK_VALIDATION_ENABLED: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      market-data-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  market-data-service:
    container_name: market-data-service
    build:
      context: ..
      dockerfile: market-data-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../market-data-service:/app/market-data-service
      - ../smarttrade-common:/app/smarttrade-common
    command: bash -c "pip uninstall -y smarttrade-common 2>/dev/null; uv sync && pip install -e /app/smarttrade-common 2>/dev/null && uv run uvicorn market_data_service.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smarttrade_market_data_service
      BROKER_ADAPTER_SERVICE_URL: http://broker-adapter-service:8000
      UV_INDEX_URL: "https://pypi.org/simple"   # fallback mirror
      UV_LINK_MODE: "copy"                      # suppress hardlink warnings
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      auth-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttrade

  mock-service:
    container_name: mock-service
    build:
      context: ..
      dockerfile: mock-service/Dockerfile
      target: runtime-dev
    volumes:
      - ../mock-service:/app/mock-service
      - ../smarttrade-common:/app/smarttrade-common
    command: bash -c "pip uninstall -y smarttrade-common 2>/dev/null; uv sync && pip install -e /app/smarttrade-common 2>/dev/null && uv run uvicorn mock_service.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8002:8000"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smarttrade_mock_service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      market-data-service:
        condition: service_started
      broker-adapter-service:
        condition: service_started
    networks:
      - smarttrade

networks:
  smarttrade:
    driver: bridge

volumes:
  postgres_data: